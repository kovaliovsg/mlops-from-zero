name: Labs verified

# Re-runs every lab exactly as a viewer would, on the 1st of every month and on every push.
# A red badge means a tool changed under us: fix the lab text, never the video.
on:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lab-what-is-mlops:
    name: "Lab · spot the drift (What is MLOps?)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly what the lab pins
        run: pip install -r lab-what-is-mlops/requirements.txt
      - name: Run the drift demo and check the checkpoint
        run: |
          python lab-what-is-mlops/drift_demo.py | tee out.txt
          grep -q "CHECKPOINT OK" out.txt

  lab-python-for-mlops:
    name: "Lab · first brick (Python for MLOps)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas exactly as the lab says
        run: pip install "pandas==3.0.6"
      - name: Run the lab script and check the checkpoint
        run: |
          python lab-python-for-mlops/first_brick.py | tee out.txt
          grep -q "rows, columns: (344, 7)" out.txt

  lab-docker:
    name: "Lab · a model in a box (Docker)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image exactly as the lab says
        run: docker build -t flower-api lab-docker
      - name: Run the container and wait for it
        run: |
          docker run -d -p 8000:8000 --name flower flower-api
          for i in $(seq 1 30); do curl -sf localhost:8000/docs > /dev/null && break; sleep 2; done
      - name: Checkpoint - the two predictions from the video
        run: |
          a=$(curl -sf "localhost:8000/predict?sepal_length=5.1&sepal_width=3.5&petal_length=1.4&petal_width=0.2")
          b=$(curl -sf "localhost:8000/predict?sepal_length=6.7&sepal_width=3.0&petal_length=5.2&petal_width=2.3")
          echo "$a"; echo "$b"
          [ "$a" = '{"flower":"setosa"}' ] && [ "$b" = '{"flower":"virginica"}' ]
      - name: Clean up
        if: always()
        run: docker rm -f flower || true
