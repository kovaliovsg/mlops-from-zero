name: Labs verified

# Re-runs every lab exactly as a viewer would, on the 1st of every month and on every push.
# A red badge means a tool changed under us: fix the lab text, never the video.
on:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lab-what-is-mlops:
    name: "Lab · spot the drift (What is MLOps?)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly what the lab pins
        run: pip install -r lab-what-is-mlops/requirements.txt
      - name: Run the drift demo and check the checkpoint
        run: |
          python lab-what-is-mlops/drift_demo.py | tee out.txt
          grep -q "CHECKPOINT OK" out.txt

