name: Labs verified

# Re-runs every lab exactly as a viewer would, on the 1st of every month and on every push.
# A red badge means a tool changed under us: fix the lab text, never the video.
on:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lab-what-is-mlops:
    name: "Lab · spot the drift (What is MLOps?)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly what the lab pins
        run: pip install -r lab-what-is-mlops/requirements.txt
      - name: Run the drift demo and check the checkpoint
        run: |
          python lab-what-is-mlops/drift_demo.py | tee out.txt
          grep -q "CHECKPOINT OK" out.txt

  lab-python-for-mlops:
    name: "Lab · stand up the prep-forecast repo (Python for MLOps)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-python-for-mlops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the pantry as the lab does - venv, newer pip, editable install, lock
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip lock -e ".[dev]"
          test -s pylock.toml
      - name: The taste test - a seed repeats the score exactly
        run: |
          source .venv/bin/activate
          [ "$(python taste_test.py --seed 42)" = "$(python taste_test.py --seed 42)" ]
      - name: Generate the order books, run the notebook, convert it to a script
        run: |
          source .venv/bin/activate
          python -m prep_forecast.generate
          jupyter nbconvert --to notebook --execute explore.ipynb --output explore-run.ipynb
          jupyter nbconvert --to script explore.ipynb
          test -s explore.py
      - name: prepare - a wrong argument exits with 2, a real run with 0
        run: |
          source .venv/bin/activate
          set +e; prepare --max-qty lots; code=$?; set -e
          [ "$code" -eq 2 ]
          prepare
      - name: Tests and the checkpoint
        run: |
          source .venv/bin/activate
          pytest
          python checkpoint.py | tee out.txt
          grep -q "CHECKPOINT OK" out.txt

  lab-docker:
    name: "Lab · a model in a box (Docker)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image exactly as the lab says
        run: docker build -t flower-api lab-docker
      - name: Run the container and wait for it
        run: |
          docker run -d -p 8000:8000 --name flower flower-api
          for i in $(seq 1 30); do curl -sf localhost:8000/docs > /dev/null && break; sleep 2; done
      - name: Checkpoint - the two predictions from the video
        run: |
          a=$(curl -sf "localhost:8000/predict?sepal_length=5.1&sepal_width=3.5&petal_length=1.4&petal_width=0.2")
          b=$(curl -sf "localhost:8000/predict?sepal_length=6.7&sepal_width=3.0&petal_length=5.2&petal_width=2.3")
          echo "$a"; echo "$b"
          [ "$a" = '{"flower":"setosa"}' ] && [ "$b" = '{"flower":"virginica"}' ]
      - name: Checkpoint - the lab's own checkpoint inside the container
        run: |
          docker exec flower python checkpoint.py | tee out.txt
          grep -q "CHECKPOINT OK" out.txt
      - name: Clean up
        if: always()
        run: docker rm -f flower || true
